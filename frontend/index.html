<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottle Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #f7f7ff;
            border-color: #764ba2;
        }
        input[type="file"] {
            display: none;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: 600;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        .preview img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍾 Bottle Detector</h1>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p>📷 Click to upload an image</p>
            <p style="color: #999; font-size: 14px; margin-top: 10px;">JPG, PNG supported</p>
        </div>
        
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        
        <div class="preview" id="preview"></div>
        
        <button id="detectBtn" onclick="detectBottle()" disabled>Detect Bottle</button>
        
        <div class="loader" id="loader"></div>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        let selectedFile = null;
        const API_URL = "https://nrl34b80qe.execute-api.us-east-1.amazonaws.com/detect";

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                document.getElementById('detectBtn').disabled = false;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').innerHTML = 
                        `<p>Selected: ${selectedFile.name}</p>
                         <img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(selectedFile);
            }
        }

        async function detectBottle() {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            document.getElementById('loader').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('detectBtn').disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                document.getElementById('loader').style.display = 'none';
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';

                if (data.bottle_detected) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Bottle Detected!</h3>
                        <p><strong>Objects found:</strong></p>
                        <ul>
                            ${data.detected_objects.map(obj => 
                                `<li>${obj.object} (${(obj.confidence * 100).toFixed(1)}% confidence)</li>`
                            ).join('')}
                        </ul>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ No Bottle Detected</h3>
                        <p>Objects found: ${data.detected_objects.map(o => o.object).join(', ') || 'None'}</p>
                    `;
                }

                document.getElementById('detectBtn').disabled = false;

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${error.message}</p>`;
                document.getElementById('detectBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
